    <article class="lc-card"><div class="lc-card__content"><h3 class="lc-card__title">Skinbooster</h3><p class="lc-card__desc">Hidratação profunda para uma pele com viço de quem dormiu bem.</p></div><div class="lc-card__media"><div class="lc-card__layer"><svg viewBox="0 0 300 300" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

  </div>
</div>
<script>document.querySelectorAll('.lc-card').forEach(c => c.addEventListener('pointermove', e => { const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px'); }));</script>
